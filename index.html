:root{--bg:#000;--panel:#0E1411;--line:#24302A;--fg:#F2F5F3;--mute:#C2CCC7;--navy:#FFF;--green:#00A859;--amber:#F2B544;--red:#FF6B5B;color-scheme:dark;

function drawHist(id){
  const H=DATA.history||[]; const key={mevduat:'mevduat',endeks:'bist100',altin:'gram_altin',dolar:'usdtry',btc:'btctry'}[id];
  const labels=['5 yıl önce','4 yıl önce','3 yıl önce','2 yıl önce','1 yıl önce','Son 6 ay'];
  const name=ASSETS.find(a=>a.id===id).name.replace('Katılma Hesabı','Katılma hesabı kâr payı');
  const idx=H.map((_,i)=>i).filter(i=>id!=='mevduat'||H[i][key]!=null);
  const vals=idx.map(i=>H[i][key]), inf=idx.map(i=>H[i].tufe), lab=idx.map(i=>labels[i]);
  const all=vals.concat(inf).filter(v=>v!=null);
  const mx=Math.max(0,...all), mn=Math.min(0,...all), rng=(mx-mn)||1;
  const W=360, LBL=0, padL=mn<0?44:6, padR=46, pw=W-padL-padR, rowH=64, top=34;
  const X=v=>padL+(v-mn)/rng*pw, x0=X(0), Ht=top+idx.length*rowH+4;
  let g=`<g font-size="12" fill="var(--fg)"><rect x="6" y="6" width="12" height="12" rx="2" fill="var(--green)"/><text x="23" y="17">${name}</text><rect x="${W/2+10}" y="6" width="12" height="12" rx="2" fill="var(--amber)"/><text x="${W/2+27}" y="17">Enflasyon</text></g>`;
  g+=`<line x1="${x0}" x2="${x0}" y1="${top-4}" y2="${Ht-4}" stroke="var(--line)"/>`;
  const bar=(v,y,col)=>{if(v==null)return `<text x="${x0+6}" y="${y+11}" font-size="11" fill="var(--mute)">veri yok</text>`;
    const xa=X(Math.min(v,0)), w=Math.max(Math.abs(X(v)-x0),1.5), tx=v>=0?x0+w+4:x0-w-4, anc=v>=0?'start':'end';
    return `<rect x="${xa}" y="${y}" width="${w}" height="14" rx="2" fill="${col}"/><text x="${tx}" y="${y+11.5}" font-size="12" font-weight="600" text-anchor="${anc}" fill="var(--fg)">${v>=0?'':'−'}%${Math.abs(Math.round(v))}</text>`};
  idx.forEach((_,i)=>{
    const y=top+i*rowH;
    g+=`<text x="6" y="${y+10}" font-size="13" font-weight="600" fill="var(--fg)">${lab[i]}</text>`;
    g+=bar(vals[i],y+16,'var(--green)')+bar(inf[i],y+34,'var(--amber)');
    if(vals[i]!=null&&inf[i]!=null){const re=((1+vals[i]/100)/(1+inf[i]/100)-1)*100;
      g+=`<text x="${W-6}" y="${y+10}" font-size="12" text-anchor="end" fill="${re>=0?'var(--green)':'var(--red)'}">Reel: ${re>=0?'+':'−'}%${Math.abs(Math.round(re))}</text>`}
  });
  document.getElementById('hchart').innerHTML=`<svg viewBox="0 0 ${W} ${Ht}" width="100%" role="img" aria-label="Son 5 yıl getiri ve enflasyon grafiği">${g}</svg>`;
  document.getElementById('hnote').textContent=(id==='mevduat'?'Katılma hesabı: piyasadaki mevduat faiz oranlarına dayanan yaklaşık kâr payı serisi (o yılın ortasındaki yıllık oran); son satırda dönem getirisi. İlk iki yılın verisi güvenilir bulunamadığı için gösterilmiyor. ':'')+'Reel: enflasyon düşüldükten sonra kalan getiri. Getiriler TL cinsinden, takvim yılı. Geçmiş getiri geleceğin garantisi değildir.';
  document.querySelectorAll('#hbtns .tab').forEach(b=>{const on=b.dataset.k===id;b.setAttribute('aria-selected',on);b.style.background=on?'var(--green)':'transparent';b.style.color=on?'#00140A':'';b.style.borderColor=on?'var(--green)':''});
}
function initHist(){document.querySelectorAll('#hbtns .tab').forEach(b=>b.onclick=()=>drawHist(b.dataset.k));drawHist('endeks')}
function ctxCards(i){
  const c=P[i].ctx; if(!c) return '';
  const nm=id=>ASSETS.find(a=>a.id===id).name.replace('Vadeli ','');
  return `<div class="card"><h3>Konjonktür</h3><ul class="rules">${c.konj.map(k=>`<li>${k.x} <span class="tags">${k.tag.map(t=>`<span class="tag">${nm(t)}</span>`).join('')}</span></li>`).join('')}</ul></div>`;
}
function stateCard(i){
  const p=P[i], st=p.start||{};
  let cum='';
  if(i>0){cum=`<tr><th>t0'dan beri</th>${ASSETS.map(a=>{let f=1;for(let k=0;k<i;k++){const r=ret(a,P[k]);f*=1+(r||0)/100}return `<td class="${cls(f-1)}">${pc((f-1)*100)}</td>`}).join('')}</tr>`}
  return `<div class="card wrap"><h3>t${i} · Şu anki durum</h3>
  <p class="small">Bu tur yaklaşık <b>${dur(p)}</b> sürecek. Karar verdikten sonra bir sonraki karar noktasına (t${i+1}) kadar portföyünüz bekler.</p>
  <table><tr><td>Politika faizi</td><td><b>${st.politika!=null?st.politika.toLocaleString('tr-TR')+'%':'—'}</b></td></tr>
  <tr><td>Katılma hesabı kâr payı (yıllık, brüt)</td><td><b>${st.mevduat!=null?st.mevduat.toLocaleString('tr-TR')+'%':'—'}</b></td></tr>
  <tr><td>Yıllık enflasyon (son açıklanan)</td><td><b>${st.tufe!=null?st.tufe.toLocaleString('tr-TR')+'%':'—'}</b></td></tr>
  <tr><td>Reel kâr payı (katılma hesabı − enflasyon)</td><td><b>${(st.mevduat!=null&&st.tufe!=null)?((st.mevduat-st.tufe>=0?'+':'−')+Math.abs(st.mevduat-st.tufe).toLocaleString('tr-TR',{maximumFractionDigits:1})+' puan'):'—'}</b></td></tr></table>
  ${i>0?`<table><tr><th></th>${ASSETS.map(a=>`<th>${a.name.replace('Vadeli ','')}</th>`).join('')}</tr>${cum}</table>`:''}</div>`;
}
function el(h){const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild}
function bar(l,btns){const b=$('#bar');b.hidden=!l&&!btns;$('#barL').innerHTML=l||'';const r=$('#barR');r.innerHTML='';(btns||[]).forEach(x=>{const e=el(`<button class="btn ${x.alt?'alt':''}" ${x.dis?'disabled':''}>${x.t}</button>`);e.onclick=x.f;r.appendChild(e)})}
function back(f,label){const b=el(`<button class="back" id="back">← ${label||'Geri'}</button>`);app.prepend(b);b.onclick=f}
function steps(){return `<div class="steps">${P.map((_,i)=>`<i class="${i<S.round?'on':i===S.round?'cur':''}"></i>`).join('')}</div>`}

function intro(){
  bar();
  app.innerHTML=`<div class="eyebrow">Yatırım Dünyası 101</div><h1>Yatırım Arenası</h1>
  <div class="card"><h3>Kurallar</h3>
  <ul class="rules">
    <li><b>Süre:</b> yaklaşık 15 ay. ${P.length} karar noktası (t0 … t${P.length-1}), her tur 2 ile 4,5 ay arası.</li>
    <li><b>Başlangıç:</b> ${fmt(START)} TL nakit.</li>
    <li><b>Varlıklar:</b> katılma hesabı, BIST 100, gram altın, dolar, Bitcoin.</li>
    <li><b>Karar:</b> her turun başında parayı yüzde olarak dağıtırsınız, toplam 100 olmalı.</li>
    <li><b>Bilgi:</b> yalnızca o güne kadar olanları bilirsiniz. Sonuç tur bitince açılır.</li>
    <li><b>Değişiklik:</b> dağılımı her turda değiştirebilirsiniz. Geçmiş turları değiştiremezsiniz.</li>
    <li><b>İşlem maliyeti:</b> portföyde değişen kısım için %0,5.</li>
    <li><b>Vergi:</b> katılma hesabı kâr payından vergi kesilir. Oranı vade ve tarih belirler, siz hesaba katın. Diğer varlıklarda vergi hesaplanmaz.</li>
    <li><b>Bitiş:</b> son turun sonunda portföy nakde çevrilir.</li>
    <li><b>Sınır:</b> bir varlığa en fazla %60 konulabilir.</li>
    <li><b>Sıralama:</b> oyun sonunda enflasyon sonrası toplam getiriye (reel getiri) göre yapılır. En yüksek reel getiri birinci olur.</li>
    <li><b>Çeşitlendirme rozeti:</b> bir turda beş varlığın hepsine para yatırırsanız o turun rozetini kazanırsınız. Sıralamayı etkilemez.</li>
    <li><b>Canlı oyun:</b> sunucu her turu başlatır, süre dolunca turu kapatır; her tur sonunda ilk 3 ve sıranız görünür.</li>
    <li>Eğitim amaçlı bir oyundur, yatırım tavsiyesi değildir.</li>
  </ul></div>
  <div class="card"><label for="nick"><b>Takma adınız</b></label><input id="nick" type="text" maxlength="14" placeholder="ör. Kurt" autocomplete="off"></div>
  <button class="btn" id="go">Katıl</button><button class="back" id="solo1" style="align-self:center">Sunucu yok mu? Tek başına oyna</button>`;
  $('#go').onclick=()=>{const n=$('#nick').value.trim();if(!n){$('#nick').focus();return}S={nick:n,round:0,w:{},val:START,hist:[],rcv:[],phase:'live',locked:{},token:S.token};liveJoin(n)};
  
  $('#solo1').onclick=()=>{const n=$('#nick').value.trim()||'Oyuncu';MODE='solo';S={nick:n,round:0,w:{},val:START,hist:[],rcv:[],phase:'play',locked:{}};save();play()}
}

function play(){
  if(S.round>=P.length) return end();
  const p=P[S.round];
  const prev=S.hist.length?S.hist[S.hist.length-1].w:null;
  // Kilitli varlıklar önceki turdaki ağırlığında kalır.
  const locked=S.locked||{};
  if(!S.cur) S.cur=Object.assign({},prev||{});
  const rows=ASSETS.map(a=>{
    const r=ret(a,p), off=r==null, lk=!!locked[a.id];
    const v=S.cur[a.id]||0;
    return `<div class="asset ${off?'off':''}"><div><b>${a.name}</b><div class="small mute">${a.note}${lk?' <span class="neg">Bu tur kilitli.</span>':''}${off?' Bu tur veri yok.':''}</div></div><span class="pct" id="p_${a.id}">${v}%</span>
    <input type="range" id="r_${a.id}" min="0" max="${MAXW}" step="5" value="${v}" ${off||lk?'disabled':''} aria-label="${a.name} yüzdesi"></div>`}).join('');
  app.innerHTML=`${steps()}<div class="eyebrow">t${S.round} · Portföy ${fmt(S.val)} TL</div>
  ${S.round>0?`<p class="small">Geçen tur getirileri: ${ASSETS.map(a=>{const r=ret(a,P[S.round-1]);return r==null?'':a.name+' '+pc(r)}).filter(Boolean).join(' · ')}. Enflasyon ${pc(P[S.round-1].tufe_donem_pct||0)}.</p>`:''}
  ${stateCard(S.round)}
  ${ctxCards(S.round)}
  ${S.round===0?histTable():''}
  <div class="card">${rows}</div>
  <p class="small mute">Yüzdeler toplamı 100 olmalı. Bir varlığa en fazla %60 konulabilir.</p>`;
  if(MODE==='live'){if(S.round>0)back(()=>reveal(S.round-1),'Önceki tur sonucu')} else if(S.round===0)back(()=>intro(),'Kurallara dön'); else back(()=>reveal(S.round-1),'Önceki tur sonucu');
  if(S.round===0)initHist();
  ASSETS.forEach(a=>{const r=$('#r_'+a.id);r.oninput=()=>{S.cur[a.id]=+r.value;$('#p_'+a.id).textContent=r.value+'%';upd()}});
  const lockedSum=0;
  function upd(){
    const t=Object.values(S.cur).reduce((a,b)=>a+b,0);
    const ok=t===100;
    bar(`<span class="tot ${ok?'ok':'bad'}">Toplam ${t}%</span>${MODE==='live'?' <span id="tmr" class="tot"></span>':''}`,[{t:'Turu onayla',dis:!ok,f:resolve}]);
  }
  upd();
}

function computeRound(w0){
  const p=P[S.round], prev=S.hist.length?S.hist[S.hist.length-1].w:{mevduat:100};
  const w=Object.assign({},w0);
  // komisyon: ağırlık değişimi
  let turn=0;ASSETS.forEach(a=>turn+=Math.abs((w[a.id]||0)-(prev[a.id]||0))/2);
  const first=S.hist.length===0; // ilk turda nakitten giriş: tüm tutar işlem sayılır (mevduat hariç)
  const traded=first?100-(w.mevduat||0):turn;
  const fee=S.val*(traded/100)*COMM;
  const base=S.val-fee;
  let after=0; const detail=[];
  ASSETS.forEach(a=>{
    const wt=(w[a.id]||0)/100; if(!wt) return;
    const r=ret(a,p)||0; const v=base*wt*(1+r/100); after+=v; detail.push({a,wt,r,v});
  });
  const nominal=(after/S.val-1)*100;
  const infl=p.tufe_donem_pct==null?0:p.tufe_donem_pct;
  const real=((1+nominal/100)/(1+infl/100)-1)*100;
  const h=hhi(w);
  S.hist.push({w,start:S.val,end:after,fee,nominal,real,infl,hhi:h,badge:ASSETS.every(a=>(w[a.id]||0)>0),detail:detail.map(d=>({name:d.a.name,wt:d.wt,r:d.r}))});
  S.rcv.push(real);
  S.val=after; S.round++;
}
function resolve(){
  computeRound(S.cur);S.locked={};S.cur=null;save();
  if(MODE==='live'){sendSub(S.hist.length-1);liveWait(S.hist.length-1,{got:0,n:'…'})}else reveal(S.hist.length-1);
}

function reveal(idx){
  const p=P[idx], h=S.hist[idx];
  app.innerHTML=`${steps()}<div class="eyebrow">t${idx} → t${idx+1} sonucu</div>${MODE==='live'?lbCard(idx):''}
  <div class="card"><div class="row" style="justify-content:space-between"><div><div class="small mute">Nominal</div><h2 class="${cls(h.nominal)}">${pc(h.nominal)}</h2></div>
  <div><div class="small mute">Reel (enflasyon sonrası)</div><h2 class="${cls(h.real)}">${pc(h.real)}</h2></div>
  <div><div class="small mute">Portföy</div><h2>${fmt(h.end)} TL</h2></div></div>
  <p class="small mute">Enflasyon ${pc(h.infl)} · işlem maliyeti ${fmt(h.fee)} TL</p>
  <p class="small"><b>${h.badge?'★ Çeşitlendirme rozeti kazandınız':'Rozet yok'}</b> <span class="mute">(${h.detail.length}/${ASSETS.length} varlık${h.badge?'':'; rozet için beşine de yatırın'}; sıralamayı etkilemez)</span></p></div>
  <div class="card wrap"><table><tr><th>Varlık</th><th>Pay</th><th>Getiri</th></tr>
  ${h.detail.map(d=>`<tr><td>${d.name}</td><td>${Math.round(d.wt*100)}%</td><td class="${cls(d.r)}">${pc(d.r)}</td></tr>`).join('')}</table></div>
  <div class="card"><h3>İpuçları ve sonuçlar</h3>${(p.ctx&&p.ctx.konj||[]).map(k=>`<div><p class="small"><b>${k.x}</b></p><ul class="rules">${k.res.map(r=>{const a=ASSETS.find(z=>z.id===r.a);const v=ret(a,p);return `<li><b>${a.name}</b> <b class="${cls(v)}">${pc(v)}</b>. ${r.t}</li>`}).join('')}</ul></div>`).join('')}</div>`;
  if(idx>0) back(()=>reveal(idx-1),'Önceki tur sonucu');
  const latest=idx===S.hist.length-1, done=S.hist.length>=P.length;
  const nxt=!latest?()=>reveal(idx+1):(done?end:()=>{S.phase='play';play()});
  const lab=!latest?'Sonraki sonuç':(done?'Sonucu gör':'Sonraki tur');
  if(MODE==='live'&&latest)bar('<span class="small mute">Sunucu devam ettirince bir sonraki ekran kendiliğinden açılır.</span>',[]);
  else bar(`<span class="small mute">${latest&&!done?'Sıradaki: t'+S.round:latest?'Son tur bitti':'Geçmiş sonuçlara bakıyorsunuz'}</span>`,[{t:lab,f:nxt}]);
}

function score(){
  const totalReal=((S.val/START)/S.hist.reduce((a,h)=>a*(1+h.infl/100),1)-1)*100;
  return {totalReal,div:S.hist.filter(h=>h.badge).length};
}
function mk(sc){
  const raw=[S.nick.replace(/[|~]/g,' '),Math.round(S.val),Math.round(sc.totalReal*100),Math.round(sc.totalReal*10),sc.div].join('~');
  let c=0;for(const ch of raw)c=(c*31+ch.charCodeAt(0))>>>0;
  return btoa(unescape(encodeURIComponent(raw+'~'+c.toString(36))));
}
function end(){
  const sc=score();
  app.innerHTML=`<div class="eyebrow">Oyun bitti</div><h1>${S.nick}, ${fmt(S.val)} TL</h1>
  <div class="card"><table><tr><td><b>Toplam reel getiri</b></td><td class="${cls(sc.totalReal)}"><b>${pc(sc.totalReal)}</b></td></tr>
  <tr><td>Çeşitlendirme rozeti</td><td>${sc.div}/${P.length} tur</td></tr></table>
  <p class="small mute">Sıralama toplam reel getiriye göre yapılır. Rozet sıralamayı etkilemez.</p></div>
  <p class="small mute">Tek başına oynadığınız için sıralamaya girmediniz.</p>
  <button class="btn alt" id="rs">Yeniden oyna</button>`;
  $('#rs').onclick=()=>{S={nick:S.nick,round:0,w:{},val:START,hist:[],rcv:[],phase:'intro',locked:{}};try{localStorage.removeItem('arena')}catch(e){};intro()};
  back(()=>reveal(S.hist.length-1),'Son tur sonucu');
  bar();
}

function host(){
  bar();
  app.innerHTML=`<div class="eyebrow">Sunucu görünümü</div><h1>Sıralama</h1>
  <p class="small mute">Öğrencilerin sonuç kodlarını her satıra bir kod gelecek şekilde yapıştırın.</p>
  <textarea id="codes" aria-label="Sonuç kodları"></textarea><button class="btn" id="ok">Tabloyu göster</button><div id="lb"></div>`;
  back(()=>{location.hash='';intro()},'Oyuna dön');
  $('#ok').onclick=()=>{
    const rows=$('#codes').value.split(/\s+/).filter(Boolean).map(c=>{try{const raw=decodeURIComponent(escape(atob(c)));const a=raw.split('~');const chk=a.pop();let h=0;for(const ch of a.join('~'))h=(h*31+ch.charCodeAt(0))>>>0;
      if(h.toString(36)!==chk)return null;return {n:a[0],v:+a[1],s:+a[2],r:+a[3]/10,d:+a[4]}}catch(e){return null}});
    const bad=rows.filter(r=>!r).length, ok=rows.filter(Boolean).sort((a,b)=>b.s-a.s);
    $('#lb').innerHTML=`<div class="card wrap"><table><tr><th>#</th><th>Takma ad</th><th>Portföy</th><th>Reel getiri</th><th>Rozet</th></tr>${ok.map((r,i)=>`<tr><td>${i+1}</td><td>${r.n.replace(/[<>&]/g,'')}</td><td>${fmt(r.v)}</td><td class="${cls(r.r)}"><b>${pc(r.r)}</b></td><td>${r.d}/${P.length}</td></tr>`).join('')}</table>${bad?`<p class="small neg">${bad} kod okunamadı.</p>`:''}</div>`;
  };
}

      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;

      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];

              bytes.push(b & 0xff);

          }

  const h=S.hist[i];if(!h||!DB)return;

}
function resendAll(){S.hist.forEach((_,i)=>sendSub(i))}
function cumReal(i){
  let f=1;for(let k=0;k<=i;k++)f*=1+S.hist[k].infl/100;
  return ((S.hist[i].end/START)/f-1)*100;
}

  S.round=S.hist.length;

  if(v.nick){S.nick=v.nick;save()}

}

  if(!s){setStat('Sunucu henüz açılmadı, bekleniyor…');return}

  <tr><td>Portföy</td><td>${fmt(S.val)} TL</td></tr>
  <tr><td>Çeşitlendirme rozeti</td><td>${sc.div}/${S.hist.length} tur</td></tr></table></div>
  <div class="card"><h3>İlk ${m.top.length}</h3>${m.top.map((x,i)=>`<div class="row" style="justify-content:space-between"><span><b>${i+1}.</b> ${esc(x.n)}</span><span class="${cls(x.tr)}"><b>${pc(x.tr)}</b></span></div>`).join('')}</div>
  <p class="small mute">Eğitim amaçlı bir oyundur; geçmiş getiri geleceğin garantisi değildir.</p>`;
  back(()=>reveal(S.hist.length-1),'Son tur sonucu');bar();
}

/* ---------- sunucu (sunum ekranı) ---------- */
function hostLive(){
  MODE='host';app.classList.add('wide');
  const H={phase:'lobby',round:-1,secs:120,dl:0,gid:newGid(),players:{},online:{},endAfter:false};
  window.__HDL=()=>H.dl;
  let ready=false,pt=null,tmr=null;
  if(!fbInit()){netBadge(false,'Bağlantı kitaplığı yüklenemedi (internet?). Öğrenciler katılamaz.');app.innerHTML='<div class="eyebrow">Sunucu</div><h1>Bağlantı kurulamadı</h1><p>Firebase kitaplığı yüklenemedi. İnternet bağlantınızı kontrol edip sayfayı yenileyin.</p>'+dbgBox();return}
  netBadge(false,'Veritabanına bağlanılıyor…');
  const n=()=>Object.keys(H.players).length;
  const isOn=t=>!!(H.online[t]||(H.players[t]&&H.players[t].fake));
  const got=r=>Object.values(H.players).filter(p=>(p.subs&&p.subs[r])||p.fake).length;
  function push(now){
    clearTimeout(pt);
    const run=()=>R('s').set({gid:H.gid,phase:H.phase,round:H.round,dl:H.dl,secs:H.secs,n:n(),got:got(H.round)});
    if(now)run();else pt=setTimeout(run,250);
  }
  function board(r){
    const a=Object.entries(H.players).map(([tok,p])=>{
      let b=null;for(let k=r;k>=0;k--)if(p.subs&&p.subs[k]){b=p.subs[k];break}
      let d=0;for(let k=0;k<=r;k++)if(p.subs&&p.subs[k]&&p.subs[k].badge)d++;
      return {tok,nick:p.nick,tr:b?b.tr:-999,val:b?b.val:START,d,has:!!b}});
    a.sort((x,y)=>y.tr-x.tr);return a;
  }
  function resMsg(t,end){
    const b=board(H.round),i=b.findIndex(x=>x.tok===t),me=b[i]||{tr:0,val:START};
    const top=b.filter(x=>x.has).slice(0,3).map(x=>({n:x.nick,tr:x.tr,v:x.val}));
    return {kind:end?'end':'results',gid:H.gid,r:H.round,top,rank:i+1,n:b.length,me:{tr:me.tr,v:me.val}};
  }
  function writeRes(end){
    Object.keys(H.players).forEach(t=>{if(!H.players[t].fake)R('res/'+t).set(resMsg(t,end))});
  }
  function syncPlayers(v){
    v=v||{};let changed=false,subsChanged=false;
    Object.keys(v).forEach(tok=>{
      const d=v[tok]||{};
      if(!H.players[tok]){
        if(H.phase!=='lobby'){R('ok/'+tok).set({late:true,gid:H.gid});return}
        const nick=String(d.nick||'Oyuncu').replace(/[<>&]/g,'').slice(0,14).trim()||'Oyuncu';
        const names=Object.values(H.players).map(x=>x.nick.toLowerCase());let nn=nick,i=2;
        while(names.includes(nn.toLowerCase()))nn=nick+' '+(i++);
        H.players[tok]={nick:nn,subs:{}};R('ok/'+tok).set({nick:nn,gid:H.gid});changed=true;dbg('oyuncu katıldı: '+nn);
      }
      const subs=d.subs||{};
      if(JSON.stringify(subs)!==JSON.stringify(H.players[tok].subs)){H.players[tok].subs=subs;subsChanged=true}
    });
    if(changed){push();light()}
    if(subsChanged){progress()}
  }
  function progress(){
    const g=got(H.round);
    const e=$('#got');if(e){e.textContent=g;const pb=$('#pb');if(pb)pb.style.width=(n()?100*g/n():0)+'%'}
    if(H.phase==='round')push();
  }
  function light(){
    const c=$('#cnt');if(c)c.textContent=n();
    const ch=$('#chips');if(ch)ch.innerHTML=chips();
    const e=$('#tot');if(e)e.textContent=n();
  }
  const chips=()=>Object.entries(H.players).map(([t,p])=>`<span class="chip ${isOn(t)?'':'off'}">${esc(p.nick)}</span>`).join('')||'<span class="mute">Henüz kimse katılmadı…</span>';
  const FN=['Kurt','Aslan','Ece','Deniz','Bora','Mira','Çınar','Lale','Poyraz','Defne','Arda','Selin'];
  function addFake(){
    if(H.phase!=='lobby')return;
    FN.forEach(nm=>{const tok='fake-'+nm;if(!H.players[tok]&&!Object.values(H.players).some(p=>p.nick===nm))H.players[tok]={nick:nm,subs:{},fake:true,v:START}});
    push(true);view();
  }
  function fakeSubs(r){
    Object.values(H.players).forEach(p=>{if(!p.fake||p.subs[r])return;
      p.v=(p.v||START)*(1+(Math.random()*0.16-0.05));
      let f=1;for(let k=0;k<=r;k++)f*=1+(P[k].tufe_donem_pct||0)/100;
      p.subs[r]={val:p.v,tr:((p.v/START)/f-1)*100,nom:0,real:0,badge:Math.random()<.3}});
  }
  function start(){if(H.phase!=='lobby'||!n())return;H.round=0;openRound()}
  function openRound(){H.phase='round';H.dl=srvNow()+H.secs*1000;sched();push(true);view()}
  function sched(){clearTimeout(tmr);if(H.phase==='round')tmr=setTimeout(closeRound,Math.max(0,H.dl-srvNow()))}
  function closeRound(){
    if(H.phase!=='round')return;clearTimeout(tmr);H.phase='closing';push(true);view();
    const t0=Date.now();
    const poll=setInterval(()=>{
      const need=Object.keys(H.players).filter(t=>H.online[t]&&!H.players[t].fake&&!(H.players[t].subs&&H.players[t].subs[H.round]));
      if(!need.length||Date.now()-t0>5000){clearInterval(poll);finish()}
    },400);
  }
  function finish(){
    fakeSubs(H.round);
    if(H.endAfter){H.endAfter=false;writeRes(true);H.phase='end';push(true);view();return}
    writeRes(false);H.phase='results';push(true);view();
  }
  function endNow(){
    if(!window.confirm('Oyun burada bitirilsin mi? Final sıralaması şu ana kadarki turlara göre hesaplanır.'))return;
    if(H.phase==='round'){H.endAfter=true;closeRound()}
    else if(H.phase==='results'){writeRes(true);H.phase='end';push(true);view()}
  }
  function next(){
    if(H.phase!=='results')return;
    if(H.round>=P.length-1){writeRes(true);H.phase='end';push(true);view();return}
    H.round++;openRound();
  }
  function extend(){if(H.phase!=='round')return;H.dl+=30000;sched();push(true)}
  function reset(){
    H.phase='lobby';H.round=-1;H.dl=0;H.gid=newGid();H.players={};H.endAfter=false;
    R('').remove().then(()=>{push(true)}).catch(()=>push(true));view();
  }
  const podium=list=>`<div class="pod">${list.map((x,i)=>`<div class="pc p${i+1}"><div class="pn">${i+1}</div><div class="pname">${esc(x.nick)}</div><div class="pr ${cls(x.tr)}">${pc(x.tr)}</div><div class="small mute">${fmt(x.val)} TL</div></div>`).join('')}</div>`;
  function view(){
    bar();
    const secsOpts=[...new Set([60,90,120,150,180,240,H.secs])].sort((a,b)=>a-b).map(s=>`<option value="${s}" ${s===H.secs?'selected':''}>${s} sn</option>`).join('');
    if(H.phase==='lobby'){
      app.innerHTML=`<div class="eyebrow">Sunucu · Yatırım Arenası</div>
      <div class="hrow"><div class="qrbox">${JOIN_QR()}<div class="small" style="color:#000">${JOIN_URL().replace('https://','')}</div></div>
      <div class="hcol"><h1 class="hbig">Telefonunuzdan katılın</h1><p class="hl">QR kodu okutun, takma ad yazın, <b>Katıl</b>’a basın.</p><p class="cnt"><b id="cnt">${n()}</b> oyuncu</p></div></div>
      <div class="chips" id="chips">${chips()}</div>
      <div class="card"><div class="row" style="align-items:center"><label for="secs">Tur süresi</label><select id="secs">${secsOpts}</select><button class="btn" id="st" style="margin-left:auto">Oyunu başlat</button></div>
      ${dbgBox()}<p class="small mute">Sunum süresince bu sekmeyi açık ve görünür tutun. Soluk görünen takma adlar şu an bağlantısı kopmuş oyunculardır.</p></div>
      <div class="row"><button class="back" id="rz" style="color:var(--mute)">Odayı sıfırla (oyuncuları sil)</button></div>`;
      $('#rz').onclick=()=>{if(window.confirm('Tüm oyuncular silinsin ve yeni oyun odası açılsın mı?'))reset()};
      $('#secs').onchange=e=>{H.secs=+e.target.value;push(true)};
      $('#st').onclick=start;
    }else if(H.phase==='round'||H.phase==='closing'){
      const g=got(H.round),c=H.phase==='closing';
      app.innerHTML=`<div class="eyebrow">Tur t${H.round} / ${P.length-1}</div>
      <div class="hbig" id="hdl" style="font-size:6rem;font-family:var(--mono)">${c?'—':''}</div>
      <div class="card"><p class="hl"><b id="got">${g}</b> / <b id="tot">${n()}</b> oyuncu kararını gönderdi</p><div class="pbar"><i id="pb" style="width:${n()?100*g/n():0}%"></i></div>
      ${c?'<p class="mute">Süre doldu, sonuçlar toplanıyor…</p>':''}</div>
      ${c?'':`<div class="row"><button class="btn alt" id="ex">+30 sn</button><button class="btn" id="cl">Turu şimdi bitir</button><button class="btn alt" id="en" style="margin-left:auto">Oyunu bitir (final)</button></div>`}`;
      if(!c){$('#ex').onclick=extend;$('#cl').onclick=closeRound;$('#en').onclick=endNow}
    }else if(H.phase==='results'){
      const r=H.round,p=P[r],b=board(r).filter(x=>x.has),last=r>=P.length-1;
      app.innerHTML=`<div class="eyebrow">Tur t${r} sonu · ${p.label}</div><h1 class="hbig">İlk 3</h1>
      ${b.length?podium(b.slice(0,3)):'<p class="mute">Henüz sonuç gelmedi.</p>'}
      <p class="small mute">${n()} oyuncu · sıralama enflasyon sonrası (reel) toplam getiriye göredir.</p>
      <div class="card wrap"><h3>Bu dönemde gerçekte olanlar (${dur(p)})</h3><table><tr><th>Varlık</th><th>Getiri</th></tr>
      ${ASSETS.map(a=>{const v=ret(a,p);return `<tr><td>${a.name}</td><td class="${cls(v)}">${v==null?'—':pc(v)}</td></tr>`}).join('')}
      <tr><td>Enflasyon (dönem)</td><td>${pc(p.tufe_donem_pct||0)}</td></tr></table></div>
      <div class="card"><h3>Neden?</h3>${(p.ctx&&p.ctx.konj||[]).map(k=>`<div><p class="small"><b>${k.x}</b></p><ul class="rules">${k.res.map(z=>{const a=ASSETS.find(q=>q.id===z.a);const v=ret(a,p);return `<li><b>${a.name}</b> <b class="${cls(v)}">${pc(v)}</b>. ${z.t}</li>`}).join('')}</ul></div>`).join('')}</div>
      <div class="row"><button class="btn" id="nx" style="flex:1">${last?'Final sıralamayı göster':'Sonraki turu başlat'}</button>${last?'':'<button class="btn alt" id="en">Oyunu burada bitir</button>'}</div>`;
      $('#nx').onclick=next;if(!last)$('#en').onclick=endNow;
    }else{
      const b=board(H.round).filter(x=>x.has);
      app.innerHTML=`<div class="eyebrow">Oyun bitti</div><h1 class="hbig">Final sıralaması</h1>
      ${b.length?podium(b.slice(0,3)):''}
      <p class="small mute">${n()} oyuncu katıldı. Her oyuncu kendi sırasını kendi telefonunda görür.</p>
      <button class="btn alt" id="rs">Yeni oyun odası aç</button>`;
      $('#rs').onclick=()=>{if(window.confirm('Tüm oyuncular ve sonuçlar silinsin mi?'))reset()};
    }
    light();
  }
  // başlangıç: veritabanındaki mevcut oda varsa devral
  Promise.all([R('s').once('value'),R('ok').once('value'),R('p').once('value'),R('pr').once('value')]).then(([sS,okS,pS,prS])=>{
    const s=sS.val(),ok=okS.val()||{},p=pS.val()||{};
    if(s&&s.gid){
      Object.assign(H,{gid:s.gid,phase:s.phase==='closing'?'results':s.phase,round:s.round,dl:s.dl||0,secs:s.secs||120});
      Object.keys(p).forEach(tok=>{if(ok[tok]&&ok[tok].nick)H.players[tok]={nick:ok[tok].nick,subs:(p[tok]&&p[tok].subs)||{}}});
      dbg('mevcut oda devralındı: '+s.phase+', '+n()+' oyuncu');
    }
    H.online=prS.val()||{};
    ready=true;
    R('pr').on('value',x=>{H.online=x.val()||{};light()});
    R('p').on('value',x=>syncPlayers(x.val()));
    if(H.phase==='round')sched();
    if(H.phase==='results'||H.phase==='end'){/* sonuçlar zaten yazılmış */}
    push(true);view();
  }).catch(e=>{dbg('HATA: '+e.message);netBadge(false,'Veritabanı hatası')});
  view();
}

if(!P.length){app.innerHTML='<h1>Yatırım Arenası</h1><p>Dönem verisi yüklenmedi.</p>'}
else if(location.hash==='#sunucu'||/[?&]sunucu/.test(location.search))hostLive();
else{if(/[?&]yeni/.test(location.search)){try{localStorage.removeItem('arena')}catch(e){}}
  load();
  if(S.live&&S.token&&S.nick){MODE='live';screenConnecting('Yeniden bağlanılıyor…');liveNet()}
  else S.phase==='play'&&S.hist.length<P.length?(S.cur?play():(S.hist.length?reveal(S.round-1):intro())):(S.hist.length>=P.length&&S.hist.length?end():intro())}
</script>
